<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TREASURER'S REPORT - Manuel d'Utilisation Officiel</title>
  <link rel="icon" type="image/x-icon" href="RachelEagles.ico" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Marked.js pour le rendu Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    @page {
      size: A4;
      margin: 15mm 15mm 15mm 15mm;
    }
    @media print {
      body {
        background: white !important;
        color: #0f172a !important;
        font-size: 10.5pt !important;
      }
      .no-print {
        display: none !important;
      }
      .page-break {
        page-break-before: always;
      }
      .avoid-break {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      a {
        text-decoration: none !important;
        color: #1e3a8a !important;
      }
    }

    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #1e3a8a;
      color: white;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .toolbar-title {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .toolbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-action {
      background: #d97706;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #b45309;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .container {
      max-width: 900px;
      margin: 24px auto;
      background: white;
      padding: 40px 48px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    /* En-tête officiel */
    .header-box {
      border-bottom: 3px solid #1e3a8a;
      padding-bottom: 24px;
      margin-bottom: 28px;
      text-align: center;
    }
    .logos-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 14px;
    }
    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .header-title {
      font-size: 24px;
      font-weight: 900;
      color: #1e3a8a;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .header-org {
      font-size: 13px;
      font-weight: 800;
      color: #0f172a;
      margin: 4px 0 0 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .header-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      background: #fef3c7;
      color: #b45309;
      font-weight: 800;
      font-size: 11px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Typographie du contenu */
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #1e3a8a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
      margin-top: 36px;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
      margin-top: 28px;
      margin-bottom: 12px;
      padding-left: 10px;
      border-left: 4px solid #d97706;
    }
    h3 {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      margin-top: 20px;
      margin-bottom: 8px;
    }
    p, li {
      font-size: 13px;
      color: #334155;
      line-height: 1.65;
    }
    ul, ol {
      padding-left: 24px;
      margin-bottom: 16px;
    }
    li {
      margin-bottom: 6px;
    }
    strong {
      color: #0f172a;
      font-weight: 700;
    }
    code {
      background: #f1f5f9;
      color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }
    blockquote {
      border-left: 4px solid #3b82f6;
      background: #eff6ff;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 8px 8px 0;
      font-size: 12.5px;
      color: #1e40af;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #f1f5f9;
      font-weight: 700;
      color: #1e3a8a;
    }
    tr:nth-child(even) {
      background: #f8fafc;
    }

    /* Pied de page officiel */
    .footer-box {
      border-top: 2px solid #e2e8f0;
      margin-top: 40px;
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
    }
    .footer-banner {
      height: 36px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <!-- Barre d'outils (invisible à l'impression) -->
  <div class="toolbar no-print">
    <div class="toolbar-title">
      <i class="fa-solid fa-file-pdf mr-2"></i>
      <span id="toolbar-title-text">Manuel Utilisateur Officiel</span>
    </div>
    <div class="toolbar-actions">
      <button onclick="switchLanguage('en')" class="btn-secondary" id="btn-lang-en">English</button>
      <button onclick="switchLanguage('fr')" class="btn-secondary" id="btn-lang-fr">Français</button>
      <button onclick="triggerPrintPdf()" class="btn-action">
        <i class="fa-solid fa-print"></i>
        <span>Imprimer / Exporter en PDF</span>
      </button>
    </div>
  </div>

  <div class="container">
    <!-- En-tête officiel -->
    <div class="header-box">
      <div class="logos-row">
        <img src="logo1.png" alt="Logo 1" class="logo-img" />
        <img src="logo2.png" alt="Logo 2" class="logo-img" />
        <img src="logo3.png" alt="Logo 3" class="logo-img" />
      </div>
      <h1 class="header-title" style="border: none; margin: 0; padding: 0;">TREASURER'S REPORT</h1>
      <div class="header-org">THE FRATERNAL ORDER OF LADY EAGLES GROUP</div>
      <div class="header-badge">Financial Record &bull; Version 2.0</div>
    </div>

    <!-- Contenu dynamique Markdown -->
    <div id="manual-content">
      <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Chargement du manuel en cours...</p>
      </div>
    </div>

    <!-- Pied de page officiel -->
    <div class="footer-box">
      <div>
        <img src="footer_banner.jpg" alt="Footer Banner" class="footer-banner" />
      </div>
      <div style="text-align: right;">
        <strong>THE FRATERNAL ORDER OF LADY EAGLES GROUP</strong><br />
        TREASURER'S REPORT &bull; Guide Officiel d'Utilisation
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentLang = urlParams.get('lang') || 'fr';
    const autoPrint = urlParams.get('print') === 'true';

    function updateLanguageUI() {
      const isFr = currentLang === 'fr';
      document.documentElement.lang = currentLang;
      document.title = isFr 
        ? "TREASURER'S REPORT - Manuel d'Utilisation Officiel"
        : "TREASURER'S REPORT - Official User Manual";
      document.getElementById('toolbar-title-text').innerText = isFr 
        ? "Manuel Utilisateur Officiel" 
        : "Official User Manual";
      
      const file = isFr ? 'MANUEL_UTILISATEUR_FR.md' : 'USER_MANUAL_EN.md';

      fetch(file)
        .then(response => {
          if (!response.ok) throw new Error("Fichier introuvable");
          return response.text();
        })
        .then(markdown => {
          document.getElementById('manual-content').innerHTML = marked.parse(markdown);
          if (autoPrint) {
            setTimeout(() => {
              window.print();
            }, 600);
          }
        })
        .catch(err => {
          document.getElementById('manual-content').innerHTML = `
            <div style="color: #dc2626; padding: 20px; background: #fef2f2; border-radius: 8px;">
              <strong>Erreur lors du chargement :</strong> ${err.message}
            </div>
          `;
        });
    }

    function switchLanguage(lang) {
      currentLang = lang;
      const newUrl = window.location.pathname + '?lang=' + lang;
      window.history.replaceState(null, '', newUrl);
      updateLanguageUI();
    }

    function triggerPrintPdf() {
      if (window.AndroidNative && typeof window.AndroidNative.printPdf === 'function') {
        const title = currentLang === 'fr' 
          ? "TREASURER_REPORT_Manuel_Utilisateur_FR" 
          : "TREASURER_REPORT_User_Manual_EN";
        window.AndroidNative.printPdf(title);
      } else {
        window.print();
      }
    }

    // Initialisation
    updateLanguageUI();
  </script>
</body>
</html>
